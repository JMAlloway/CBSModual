[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankscreener"
version = "0.1.0"
description = "FFIEC Call Report / UBPR pipeline for a community-bank valuation screen"
requires-python = ">=3.11"
dependencies = ["pandas", "duckdb", "pyyaml", "requests", "typer", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bank = "bankscreener.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
